<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040c">
<title>Jujutsu Incremental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06030b;--rd:#e5142b;--pu:#8a3dff;--tx:#f3eefb;--mu:#a699c2;--ln:#ffffff2e;--gr:linear-gradient(135deg,#e5142b,#8a3dff);--jp:'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP',serif;--hd:'Anton','Chakra Petch',Impact,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.4 'Chakra Petch',system-ui,sans-serif}
body{background:radial-gradient(#ffffff12 1px,transparent 1.6px) 0 0/9px 9px,radial-gradient(120% 45% at 50% 0,#33104f,transparent),var(--bg)}
button{font-family:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{max-width:560px;height:100vh;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
#app:before{content:'呪';position:absolute;inset:0;display:grid;place-items:center;font:900 75vh/1 var(--jp);color:#ffffff09;pointer-events:none}
#hud{position:relative;z-index:2;display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 9px;background:linear-gradient(#000,#0b0614);border-bottom:2px solid var(--rd)}
.pl{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.pl b{display:block;font:400 15px/1 var(--hd);letter-spacing:.05em;white-space:nowrap}
.pl small{font-size:11px}
.dia{--s:30px;width:var(--s);height:var(--s);margin:calc(var(--s)*.2);transform:rotate(45deg);background:var(--gr);border:2px solid #fff;box-shadow:0 0 0 2px #000,0 0 14px var(--rd);display:grid;place-items:center;flex:none}
.dia span{transform:rotate(-45deg);font-family:var(--jp);font-weight:900;font-size:calc(var(--s)*.5);line-height:1;color:#fff}
.chip{display:flex;align-items:center;gap:4px;background:#000;padding:3px 11px 3px 4px;font-size:13px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);white-space:nowrap}
.chip em{font:400 10px var(--hd);font-style:normal;background:var(--gr);padding:2px 5px;letter-spacing:.05em}
.chip b{color:#fff}
#main{position:relative;flex:1;min-height:0;overflow-y:auto;padding:12px 12px 30px}
#main.home{padding:0;overflow:hidden}
h1,h2{font:400 22px/1 var(--hd);letter-spacing:.05em;text-transform:uppercase}
h2{display:inline-block;margin:8px 0 10px -12px;padding:5px 24px 5px 20px;background:#000;border-left:8px solid var(--rd);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);font-size:19px}
.card{background:linear-gradient(160deg,#170b26f2,#0a0511f2);border:1px solid var(--ln);border-left:5px solid var(--rd);padding:10px 12px;margin:0 0 12px;box-shadow:5px 5px 0 #2a1352}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row+.row{margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px;text-align:center;margin-top:8px}
.grid div{background:#000a;border:1px solid var(--ln);padding:4px}
.grid small,.grid b{display:block}
small,.mu{color:var(--mu);font-size:12.5px}
.btn{font-weight:700;font-size:15px;color:#fff;border:0;padding:10px 20px;background:var(--gr);cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:inset 0 2px 0 #fff6,inset 0 -3px 0 #0006;transition:transform .1s,filter .2s}
.btn small{color:#ffe;opacity:.85}
.btn:active{transform:scale(.95)}
.btn.gh{background:#2b1853}
.btn.s{clip-path:none;text-align:left;width:100%;background:linear-gradient(100deg,#1d0f33,#0b0614);border:1px solid var(--ln);border-left:5px solid var(--pu);box-shadow:3px 3px 0 #000}
.btn:disabled{filter:grayscale(1) brightness(.5);cursor:default}
.bar{height:12px;background:#000;border:2px solid #fff;transform:skewX(-20deg);margin:7px 6px}
.bar i{display:block;height:100%;background:var(--gr);transition:width .3s}
.bar.hp i{background:linear-gradient(90deg,#8d0f1f,#ff3b4f)}
.bar.ce i{background:linear-gradient(90deg,#5a22b8,#b07bff)}
.tag{font-size:12px;font-weight:700;padding:1px 9px;border:1px solid currentColor;background:#000a}
.r0{color:#a5a0b5}.r1{color:#4aa3ff}.r2{color:#b57bff}.r3{color:#ffc04a}.r4{color:#ff3b5c}
.stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#4b1a96,#14082a 55%,#06030b)}
.stage:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(#06030bd9,transparent 30%,transparent 50%,#06030bf5)}
.stage>*{position:absolute;z-index:3}
.stage>.hero{inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.stage>.ink{inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.mini{top:8px;left:50%;transform:translateX(-50%);height:62px;max-width:82%;object-fit:contain;mix-blend-mode:screen}
.rk{left:14px;top:96px;width:160px}
.rk .dia{--s:62px;margin:14px 0 22px 14px}
.rk b{display:block;font:400 30px/1 var(--hd);letter-spacing:.04em;text-shadow:3px 3px 0 #000}
.rk small{display:block;text-shadow:0 0 6px #000}
.side{right:0;top:88px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.side button{display:flex;align-items:center;background:none;border:0;color:#fff;cursor:pointer;padding:0 8px 0 0}
.side span{font:400 15px/1.1 var(--hd);letter-spacing:.05em;text-align:right;text-transform:uppercase;background:linear-gradient(90deg,#0000,#1b0b33f0 35%);padding:7px 34px 7px 28px;margin-right:-30px;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.side span small{display:block;font:500 10px var(--jp);color:#d9c9ff}
.side i{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#6a2ad0,#1a0a33);border:2px solid #fff;box-shadow:0 0 0 2px #000,0 0 14px var(--pu)}
.side svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--rd);border:2px solid #fff;animation:pulse 1.4s infinite}
.quest{left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"e b u" "e s u";align-items:center;column-gap:12px;padding:10px 14px;border:0;background:#efe7d8;color:#0a0510;text-align:left;cursor:pointer;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.quest em{grid-area:e;font:900 21px/1.1 var(--jp);font-style:normal;color:#fff;background:var(--rd);padding:8px 5px;writing-mode:vertical-rl}
.quest b{grid-area:b;font:italic 400 28px/1 var(--hd);letter-spacing:.05em}
.quest small{grid-area:s;color:#4a3a5a;font-weight:700}
.quest u{grid-area:u;text-decoration:none;background:#000;color:#fff;font:400 22px var(--hd);padding:10px 18px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.quest:active{filter:brightness(.9)}
.core{display:grid;place-items:center;width:178px;height:178px;margin:6px auto 14px;border:0;border-radius:50%;color:#fff;cursor:pointer;background:radial-gradient(circle at 38% 32%,#ff6a7e,#8a3dff 52%,#1a0a33);box-shadow:0 0 0 5px #000,0 0 0 8px #fff,0 0 40px var(--pu);animation:breathe 2.4s infinite;transition:transform .1s}
.core:active{transform:scale(.9)}
.core span{display:block;font:900 16px/1.1 var(--jp);text-shadow:0 2px 0 #0008}
.core b{display:block;font:400 34px/1 var(--hd);letter-spacing:.06em}
.core small{display:block;font-size:12px;color:#fff;opacity:.9}
#bar{position:relative;height:28px;background:#000;border:2px solid #fff;transform:skewX(-14deg);margin:12px 6px;overflow:hidden}
#zone{position:absolute;left:38%;width:24%;height:100%;background:#8a3dff73}
#zone:after{content:"";position:absolute;left:37.5%;width:25%;height:100%;background:#e5142bb3}
#mk{position:absolute;top:0;width:4px;height:100%;background:#fff;box-shadow:0 0 8px #fff}
.foe{text-align:center;border-left-color:var(--pu)}
.aura{position:relative;width:104px;height:104px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;font:900 52px/1 var(--jp);color:#fff;background:radial-gradient(circle,#000 36%,#4b1a96 62%,transparent 74%);box-shadow:0 0 34px var(--pu);animation:pulse 2.2s infinite}
.aura:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px dashed #fff8;animation:spin 14s linear infinite}
.aura.boss{box-shadow:0 0 40px var(--rd);background:radial-gradient(circle,#000 36%,#8d0f1f 62%,transparent 74%)}
.hit .aura{animation:shake .3s}
.phit{animation:flash .4s}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.orb{position:relative;width:140px;height:140px;margin:14px auto 30px;border-radius:50%;display:grid;place-items:center;font:900 32px var(--jp);color:#fff;background:radial-gradient(circle at 35% 30%,#ff6a7e,#8a3dff 55%,#1a0a33);box-shadow:0 0 0 4px #000,0 0 0 6px #fff,0 0 44px var(--pu);animation:pulse 2.4s infinite}
.orb:before,.orb:after{content:"";position:absolute;inset:-22px;border-radius:50%;border:2px dashed #fffa;animation:spin 16s linear infinite}
.orb:after{inset:-38px;border-color:#e5142baa;animation-direction:reverse}
.res{border:3px solid currentColor;box-shadow:0 0 28px currentColor;text-align:center;animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
.res h2{display:block;margin:4px 0 8px;padding:0;background:none;border:0;clip-path:none;font-size:34px}
#toast{position:absolute;left:50%;bottom:98px;transform:translate(-50%,16px) skewX(-8deg);max-width:92%;background:#000;border:2px solid #fff;border-left:6px solid var(--rd);padding:8px 16px;opacity:0;transition:.3s;pointer-events:none;z-index:15;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0) skewX(-8deg)}
#nav{position:relative;z-index:20;display:flex;align-items:flex-end;justify-content:space-around;background:#000;border-top:2px solid var(--pu);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
#nav button{border:0;color:var(--mu);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:20%;height:50px;margin:0 -2px;cursor:pointer;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);background:linear-gradient(#1a0d2e,#0c0616)}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#fff;background:var(--gr)}
#nav button.on svg{filter:drop-shadow(0 0 4px #fff)}
#nav #crest{position:relative;width:74px;height:74px;margin:-34px 0 0;border-radius:50%;clip-path:none;background:radial-gradient(circle,#2a1050 40%,#0b0614);border:3px solid #fff;color:#fff;box-shadow:0 0 0 3px #000,0 0 18px var(--pu);transition:transform .5s,box-shadow .3s}
#nav #crest:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px dashed var(--rd);animation:spin 18s linear infinite}
#nav #crest svg{width:40px;height:40px}
#nav #crest.on{background:var(--gr)}
#nav #crest.open{transform:rotate(180deg);box-shadow:0 0 0 3px #000,0 0 28px var(--rd)}
#fan{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));width:0;height:0}
#fan button{position:absolute;left:-30px;top:-30px;width:60px;height:60px;margin:0;clip-path:none;border-radius:50%;background:radial-gradient(circle,#4a1a96,#14082a);border:2px solid #fff;color:#fff;font-size:9.5px;opacity:0;pointer-events:none;transform:scale(.2);transition:transform .35s cubic-bezier(.3,1.6,.5,1) calc(var(--i)*.05s),opacity .2s;box-shadow:0 0 0 2px #000,0 0 14px var(--pu)}
#fan svg{width:20px;height:20px}
#fan.open button{opacity:1;pointer-events:auto;transform:translate(var(--x),var(--y))}
#title{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#000;transition:opacity .6s,transform .6s}
#title.out{opacity:0;transform:scale(1.15);pointer-events:none}
.tbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;box-shadow:inset 0 0 160px 70px #000}
#title .lg{position:relative;z-index:1;width:min(94vw,720px);mix-blend-mode:screen;animation:glow 3s ease-in-out infinite}
#title .btn{position:relative;z-index:1;font:400 22px var(--hd);letter-spacing:.12em;padding:12px 56px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.3)}}
@keyframes breathe{50%{box-shadow:0 0 0 5px #000,0 0 0 8px #fff,0 0 64px var(--rd)}}
@keyframes glow{50%{filter:drop-shadow(0 0 20px #e5142b) drop-shadow(0 0 36px #8a3dff)}}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0;filter:blur(8px)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes flash{0%{box-shadow:inset 0 0 40px var(--rd)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header id="hud"></header>
<main id="main"></main>
<div id="toast"></div>
<nav id="nav"></nav>
</div>
<div id="title">
<img class="tbg" src="https://media1.tenor.com/m/I-taHgOa4oMAAAAC/specialz-jjk-s2-opening.gif" alt="" referrerpolicy="no-referrer" onerror="this.remove()">
<img class="lg" src="logo.png" alt="Jujutsu Incremental" onerror="this.outerHTML='<h1 class=lg>Jujutsu Incremental</h1>'">
<button class="btn" id="go">Begin</button>
</div>
<script>
/* ===== DATA ===== */
const GR=['Grade 4','Grade 3','Grade 2','Grade 1','Special Grade'],RA=['Common','Rare','Epic','Legendary','Mythical'];
const ST=[['ce','Cursed Energy'],['str','Strength'],['dur','Durability'],['spd','Speed'],['tech','Technique']];
const NEED=[25,80,250,700],SAVE='sorcerer-save-v1',WT=[60,28,9,2.5,.5];
// technique: [name, rarity, CE cost, damage mult, cooldown, effect]
const TQ=[['Reinforced Fist',0,5,1.7,1,''],['Cursed Jab',0,8,2.2,2,''],['Shadow Hounds',1,12,2.6,2,''],['Binding Vow',1,14,1.8,4,'stun'],['Blood Lash',2,18,3.4,2,''],['Mending Seal',2,20,0,5,'heal'],['Divergent Fist',3,28,5,3,''],['Void Barrier',3,30,3,5,'stun'],['Cleaving Eclipse',4,50,8,4,''],['Hollow Sanctum',4,60,11,6,'']];
const EN=[['Cursed Larva','Sewer Wraith'],['Hungry Ghost','Grudge Crow'],['Maw Spirit','Cradle Curse'],['Plague Ogre','Hollow Matron'],['Calamity King','Dread Sovereign']];
const PL=['Abandoned school','Hospital ruins','Subway tunnel','Cursed shrine','Night alley'];
const SL={w:'Cursed Tool',a:'Warding Robe',c:'Talisman'},SD={w:'damage',a:'max HP',c:'training gain'};
const UP=[['c','Training Methods','+1 TP per click',25,1.4],['a','Daily Routine','+0.5 TP/s idle',40,1.45],['y','Sponsor Funding','+10% yen',60,1.6]];
const AC=[['a1','First Steps','Earn 100 TP',s=>s.rec.tp>=100],['a2','First Exorcism','Exorcise a spirit',s=>s.rec.kills>=1],['a3','Exorcist','Exorcise 25 spirits',s=>s.rec.kills>=25],['a4','Grade 3 Sorcerer','Get promoted',s=>s.g>=1],['a5','Grade 2 Sorcerer','Reach Grade 2',s=>s.g>=2],['a6','Grade 1 Sorcerer','Reach Grade 1',s=>s.g>=3],['a7','Special Grade','Reach Special Grade',s=>s.g>=4],['a8','Collector','Own 5 techniques',s=>Object.keys(s.tq).length>=5],['a9','In Sync','Reach a 5 combo',s=>s.rec.combo>=5],['a10','Boss Slayer','Defeat a boss',s=>s.rec.boss>=1]];

/* ===== STATE (plain JSON, ready to sync to Supabase later) ===== */
const fresh=()=>({tp:0,yen:0,core:3,g:0,s:{ce:1,str:1,dur:1,spd:1,tech:1},u:{c:0,a:0,y:0},tq:{},eq:[],gear:{},rec:{kills:0,boss:0,tp:0,combo:0,cal:0},ach:{},t:Date.now()});
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));return d?{...fresh(),...d}:fresh()}catch(e){return fresh()}}
function save(){S.t=Date.now();try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
let S=load(),C=null,tab='home',last='',combo=0,L=[],TS=0,RL=null;

/* ===== HELPERS / DERIVED STATS ===== */
const $=id=>document.getElementById(id),f=n=>n>=1e9?n.toExponential(2):n>=100?Math.floor(n).toLocaleString():String(Math.floor(n*10)/10);
const mult=()=>3**S.g,T=()=>Object.values(S.s).reduce((a,b)=>a+b,0),gb=k=>S.gear[k]?S.gear[k].b:0;
const maxHp=()=>Math.round((50+10*S.s.dur)*(1+gb('a')/100)),maxCe=()=>20+5*S.s.ce;
const atk=()=>(3+2*S.s.str+1.5*S.s.ce)*(1+S.s.tech*.03)*(1+gb('w')/100);
const click=()=>(1+S.u.c)*mult()*(1+gb('c')/100),auto=()=>S.u.a*.5*mult()*(1+gb('c')/100);
const cost=l=>Math.ceil(4*l**1.3),ucost=u=>Math.ceil(u[3]*u[4]**S.u[u[0]]);
const pos=()=>{const t=(Date.now()%1600)/800;return t<1?t:2-t};
const lg=m=>{L.unshift(m);L=L.slice(0,7);TS=Date.now()};
const addTp=n=>{S.tp+=n;S.rec.tp+=n};
const roll=()=>{let x=Math.random()*100,r=0;WT.some((w,i)=>(r=i,(x-=w)<0));return r};

/* ===== TRAINING + MINIGAME ===== */
function focus(){const d=Math.abs(pos()-.5);let m=1,w='Miss';
 if(d<.03){m=15;w='PERFECT'}else if(d<.12){m=6;w='Good'}
 combo=m>1?combo+1:0;S.rec.combo=Math.max(S.rec.combo,combo);
 const g=click()*m*(1+Math.min(combo,10)*.1);addTp(g);lg(`Cursed energy control: ${w}! +${f(g)} TP`)}

/* ===== TECHNIQUES + GEAR ===== */
function awaken(){if(S.core<3)return;S.core-=3;
 const r=Math.min(roll(),S.g+1),pool=TQ.map((_,i)=>i).filter(i=>TQ[i][1]==r),i=pool[Math.random()*pool.length|0];
 S.tq[i]=(S.tq[i]||0)+1;if(S.tq[i]==1&&S.eq.length<3)S.eq.push(i);
 RL={i,r,n:S.tq[i]};lg(`Awakened ${TQ[i][0]} (${RA[r]})${S.tq[i]>1?', now Lv'+S.tq[i]:''}!`)}
function drop(mg){const r=Math.min(roll(),mg),s='wac'[Math.random()*3|0],b=Math.round((5+Math.random()*5)*(r+1)),c=S.gear[s],n=`${RA[r]} ${SL[s]} (+${b}% ${SD[s]})`;
 if(!c||b>c.b){S.gear[s]={r,b};return n+' equipped'}
 const y=Math.round(b*2*3**mg);S.yen+=y;return n+` scrapped for ${y}¥`}

/* ===== COMBAT ===== */
const skills=()=>[{id:'st',n:'Strike',c:0,m:.8,cd:0,t:''},{id:'bl',n:'CE Blast',c:10,m:1.4,cd:0,t:''},{id:'gd',n:'Guard',c:0,m:0,cd:0,t:'guard'},...S.eq.map(i=>({id:'t'+i,n:TQ[i][0],c:TQ[i][2],m:TQ[i][3]*(1+.15*(S.tq[i]-1)),cd:TQ[i][4],t:TQ[i][5]}))];
function foe(g,boss,x=1){const m=3**g;return{n:(boss?'★ ':'')+EN[g][boss?1:0],g,hp:Math.round(40*m*(boss?3.5:1)*x),atk:6*m*(boss?1.6:1)*(1+(x-1)/2)}}
function start(kind,g,boss,x){const e=foe(g,boss,x);e.mhp=e.hp;C={e,kind,mg:g,hp:maxHp(),ce:maxCe(),cd:{},stun:0,guard:0,over:0,res:'',place:PL[Math.random()*5|0]};L=[];lg(`${e.n} appears! (${C.place})`)}
function act(id){const s=skills().find(x=>x.id===id);if(!s||C.over||C.ce<s.c||C.cd[id]>0)return;
 C.ce-=s.c;C.cd[id]=s.cd+1;C.fx='';
 if(s.t=='guard'){C.guard=1;C.ce=Math.min(maxCe(),C.ce+10);lg('You brace and recover cursed energy.')}
 else if(s.t=='heal'){const h=Math.round(maxHp()*.35);C.hp=Math.min(maxHp(),C.hp+h);lg(`${s.n}: healed ${h}.`)}
 else{const d=Math.round(atk()*s.m*(.9+Math.random()*.2));C.e.hp-=d;C.fx+='e';lg(`${s.n} hits for ${f(d)}.`);if(s.t=='stun'&&Math.random()<.6){C.stun=1;lg('The enemy is bound!')}}
 if(C.e.hp<=0)return end(1);
 if(C.stun){C.stun--;lg('The enemy is stunned and loses its turn.')}
 else if(Math.random()<Math.min(.4,S.s.spd*.005))lg('You dodged!');
 else{let d=Math.round(C.e.atk*(.8+Math.random()*.4));if(C.guard)d=Math.round(d/2);C.hp-=d;C.fx+='p';lg(`${C.e.n} hits you for ${f(d)}.`)}
 C.guard=0;
 if(C.hp<=0)return end(0);
 for(const k in C.cd)C.cd[k]=Math.max(0,C.cd[k]-1);
 C.ce=Math.min(maxCe(),C.ce+3+S.s.ce*.1)}
function end(w){C.over=1;
 if(!w){C.res='Defeat';return lg('You were defeated. Train harder and try again.')}
 C.res='Victory';const k=C.kind,m=3**C.mg,b=k=='mission'?1:5,r=S.rec,tp=Math.round(15*m*b*(1+gb('c')/100)),yen=Math.round(10*m*b*(1+.1*S.u.y));
 addTp(tp);S.yen+=yen;r.kills++;let msg=`Victory! +${f(tp)} TP, +${f(yen)}¥`;
 const cr=k=='mission'?(Math.random()<.35?1:0):3;if(cr){S.core+=cr;msg+=`, +${cr} core${cr>1?'s':''}`}
 if(k!='mission'||Math.random()<.3)msg+=', '+drop(C.mg);
 if(k!='mission')r.boss++;
 if(k=='exam'){S.g++;msg+=`. PROMOTED to ${GR[S.g]}!`}
 if(k=='cal')r.cal++;
 lg(msg)}

/* ===== UI ===== */
const GIF='https://media1.tenor.com/m/I-taHgOa4oMAAAAC/specialz-jjk-s2-opening.gif';
const IC={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',train:'M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z',battle:'M4 4l12 12M20 4L8 16M3 21l5-5M21 21l-5-5',roll:'M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z',inv:'M6 8h12l1 13H5zM9 8a3 3 0 0 1 6 0',profile:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-6 15-6 16 0',index:'M5 3h11a3 3 0 0 1 3 3v15H8a3 3 0 0 1-3-3zM5 18a3 3 0 0 1 3-3h11',settings:'M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6'};
const ic=k=>`<svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>`;
const NAV=['home','train','crest','battle','roll'],MENU=[['inv','Inventory',155],['profile','Profile',115],['index','Index',65],['settings','Settings',25]];
const GK=['四','三','二','一','特'];
const EF={ce:'max CE and regen',str:'damage',dur:'max HP',spd:'dodge chance',tech:'skill damage'},SN={ce:'CE',str:'STR',dur:'DUR',spd:'SPD',tech:'TECH'};
const bar=(v,m,c='')=>`<div class="bar ${c}"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%"></i></div>`;
function buildNav(){
 $('nav').innerHTML=NAV.map(k=>k=='crest'?'<button id="crest" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 5l3.5 7-3.5 7-3.5-7zM5 12h14"/></svg></button>':`<button data-t="${k}">${ic(k)}<span>${k[0].toUpperCase()+k.slice(1)}</span></button>`).join('')
 +`<div id="fan">${MENU.map(([k,n,a],i)=>`<button data-t="${k}" style="--x:${Math.round(Math.cos(a*Math.PI/180)*92)}px;--y:${-Math.round(Math.sin(a*Math.PI/180)*92)}px;--i:${i}">${ic(k)}<span>${n}</span></button>`).join('')}</div>`}

function fight(){const e=C.e,mh=maxHp(),mc=maxCe(),fx=C.fx||'';
 let h=`<div class="card foe${fx.includes('e')?' hit':''}"><div class="aura${e.n[0]=='★'?' boss':''}"><span>呪</span></div><b>${e.n}</b> <span class="tag r${e.g}">${GR[e.g]}</span><br><small>${C.place}</small>${bar(e.hp,e.mhp,'hp')}<small>${f(Math.max(0,e.hp))} / ${f(e.mhp)} HP</small></div>
<div class="card${fx.includes('p')?' phit':''}"><div class="row"><b>You</b><small>${f(Math.max(0,C.hp))}/${mh} HP · ${Math.floor(C.ce)}/${mc} CE</small></div>${bar(C.hp,mh,'hp')}${bar(C.ce,mc,'ce')}</div><div class="sk">`;
 skills().forEach(s=>{const w=C.cd[s.id]||0;h+=`<button class="btn s" data-a="act" data-k="${s.id}" ${C.over||C.ce<s.c||w?'disabled':''}>${s.n}<br><small>${s.t=='guard'?'halve next hit, +10 CE':s.t=='heal'?s.c+' CE, heal 35%':s.c?s.c+' CE':'free'}${s.cd?' · cd '+s.cd:''}${w?' · wait '+w:''}</small></button>`});
 h+=`</div><div class="card">${L.slice(0,5).join('<br>')}</div>`;
 return h+(C.over?`<div class="card res ${C.res=='Victory'?'r3':'r4'}"><h2>${C.res}</h2><button class="btn" data-a="back">Continue</button></div>`:'<button class="btn gh" data-a="back">Flee</button>')}

const V={
home(){const nx=S.g<4?NEED[S.g]:T(),ex=S.g<4&&T()>=NEED[S.g],dot=x=>x?'<b class="dot"></b>':'',
 SB=[['battle','Mission','任務',ex],['roll','Awaken','術式',S.core>=3],['inv','Inventory','所持品',Object.keys(S.tq).length>S.eq.length&&S.eq.length<3],['profile','Profile','術師',0]];
 return `<div class="stage"><img class="hero" src="${GIF}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">
<svg class="ink" viewBox="0 0 390 560" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke-linecap="round"><path d="M-10 96C90 40 170 140 270 76S390 50 410 90" stroke="#000" stroke-width="18"/><path d="M-10 480C110 540 190 420 300 490S395 520 420 470" stroke="#000" stroke-width="24"/><path d="M30 250C10 360 110 420 210 380" stroke="#e5142b" stroke-width="5" stroke-dasharray="46 8 4 8"/></g></svg>
<img class="mini" src="logo.png" alt="Jujutsu Incremental" onerror="this.remove()">
<div class="rk"><div class="dia"><span>${GK[S.g]}</span></div><b>${GR[S.g]}</b><small>${RA[S.g]} · power ${T()}/${nx}</small>${bar(T(),nx)}${ex?'<small class="r3">Promotion exam ready!</small>':''}</div>
<div class="side">${SB.map(([t,n,j,d])=>`<button data-t="${t}"><span>${n}<small>${j}</small></span><i>${ic(t)}${dot(d)}</i></button>`).join('')}</div>
<button class="quest" data-a="quest"><em>祓除</em><b>MISSION</b><small>${GR[S.g]} spirit · x${3**S.g} rewards</small><u>GO</u></button></div>`},
train(){
 let h=`<div class="card"><button class="core" data-a="train"><span>呪力<b>TRAIN</b><small>+${f(click())} TP · ${f(auto())}/s idle</small></span></button>
<div id="bar"><div id="zone"></div><div id="mk"></div></div>
<div class="row"><button class="btn gh" data-a="focus">Control cursed energy</button><small>combo x${combo}</small></div><small>Press when the line is in the purple zone. Red centre is perfect.</small></div>
<h2>Stats</h2><div class="card"><small>Total ${T()} / ${S.g<4?NEED[S.g]+' for the promotion exam':'max grade'} · Dodge ${Math.min(40,S.s.spd*.5)}%</small>`;
 ST.forEach(([k,n])=>{const c=cost(S.s[k]);h+=`<div class="row"><div><b>${n}</b> <span class="mu">Lv ${S.s[k]}</span><br><small>${EF[k]}</small></div><button class="btn" data-a="stat" data-k="${k}" ${S.tp<c?'disabled':''}>+1 · ${f(c)} TP</button></div>`});
 h+='</div><h2>Upgrades</h2><div class="card">';
 UP.forEach(u=>{const c=ucost(u);h+=`<div class="row"><div><b>${u[1]}</b> <span class="mu">Lv ${S.u[u[0]]}</span><br><small>${u[2]}</small></div><button class="btn" data-a="up" data-k="${u[0]}" ${S.yen<c?'disabled':''}>${f(c)}¥</button></div>`});
 return h+'</div>'},
battle(){if(C)return fight();
 let h='<h2>Missions</h2>';
 for(let i=0;i<=S.g;i++)h+=`<div class="card row"><div><b class="r${i}">${GR[i]} spirit</b><br><small>x${3**i} rewards · drops ${RA[i]} gear</small></div><button class="btn" data-a="go" data-i="${i}">Fight</button></div>`;
 h+='<h2>Boss battles</h2>';
 return h+(S.g<4?`<div class="card row"><div><b>Promotion Exam</b> <span class="tag r${S.g+1}">${GR[S.g+1]}</span><br><small>Needs ${NEED[S.g]} total stats (you have ${T()})</small></div><button class="btn" data-a="exam" ${T()<NEED[S.g]?'disabled':''}>Challenge</button></div>`:`<div class="card row"><div><b>Calamity Raid</b> <span class="tag r4">Special Grade</span><br><small>Cleared ${S.rec.cal} · stronger every clear</small></div><button class="btn" data-a="cal">Challenge</button></div>`)},
roll(){
 return `<h2>Awaken</h2><div class="card" style="text-align:center"><div class="orb">術式</div><button class="btn" data-a="awaken" ${S.core>=3?'':'disabled'}>Awaken technique · 3 cores</button><br><small>You have ${S.core} cores. Duplicates level a technique up. Your grade caps the rarity you can reach (${RA[Math.min(4,S.g+1)]}).</small></div>`
 +(RL?`<div class="card res r${RL.r}"><span class="tag">${RA[RL.r]}</span><h2>${TQ[RL.i][0]}</h2><small>${RL.n>1?'Duplicate! Now Lv '+RL.n:'New technique!'} · ${TQ[RL.i][2]} CE · x${TQ[RL.i][3]} · cd ${TQ[RL.i][4]}</small></div>`:'')
 +`<div class="card"><b>Odds</b><br>${RA.map((n,i)=>`<span class="tag r${i}">${n} ${WT[i]}%</span>`).join(' ')}</div>`},
inv(){
 let h=`<h2>Techniques</h2><small>${S.eq.length}/3 equipped</small>`;
 const own=Object.keys(S.tq);if(!own.length)h+='<div class="card"><small>None yet. Awaken one in the Roll tab.</small></div>';
 own.forEach(i=>{const t=TQ[i],on=S.eq.includes(+i);h+=`<div class="card row r${t[1]}" style="border-left-color:currentColor"><div><b>${t[0]}</b> <span class="tag">${RA[t[1]]}</span><br><small>Lv ${S.tq[i]} · ${t[2]} CE · x${(t[3]*(1+.15*(S.tq[i]-1))).toFixed(1)} · cd ${t[4]}${t[5]?' · '+t[5]:''}</small></div><button class="btn${on?' gh':''}" data-a="eq" data-k="${i}">${on?'Unequip':'Equip'}</button></div>`});
 h+='<h2>Equipment</h2>';
 for(const s in SL){const g=S.gear[s];h+=`<div class="card row"><b>${SL[s]}</b>${g?`<span class="r${g.r}">${RA[g.r]} · +${g.b}% ${SD[s]}</span>`:'<small>empty</small>'}</div>`}
 return h+'<small>Gear drops from missions and bosses. The best piece per slot equips automatically.</small>'},
profile(){const r=S.rec;
 let h=`<h2>Profile</h2><div class="card"><div class="row"><b class="r${S.g}">${GR[S.g]} Sorcerer</b><span class="tag r${S.g}">${RA[S.g]}</span></div><div class="grid">${ST.map(([k])=>`<div><small>${SN[k]}</small><b>${S.s[k]}</b></div>`).join('')}</div></div>
<div class="card"><b>Records</b>${[['Highest grade',GR[S.g]],['Total stats',T()],['Total TP earned',f(r.tp)],['Spirits exorcised',r.kills],['Bosses defeated',r.boss],['Calamity raids cleared',r.cal],['Best focus combo',r.combo]].map(x=>`<div class="row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<h2>Achievements ${Object.keys(S.ach).length}/${AC.length}</h2><div class="card">`;
 AC.forEach(a=>h+=`<div class="row"><span>${S.ach[a[0]]?'✅':'⬜'} ${a[1]}</span><small>${a[2]}</small></div>`);
 return h+'</div>'},
index(){
 let h='<h2>Index</h2><div class="card"><b>Grades</b>';
 GR.forEach((g,i)=>h+=`<div class="row"><span class="r${i}"><b>${g}</b> · ${RA[i]}</span><small>${i?'exam at '+NEED[i-1]+' stats':'starting grade'}</small></div>`);
 h+=`</div><div class="card"><b>Techniques ${Object.keys(S.tq).length}/${TQ.length}</b>`;
 TQ.forEach((t,i)=>{const o=S.tq[i];h+=`<div class="row r${t[1]}"><span>${o?t[0]:'???'}</span><small>${RA[t[1]]}${o?' · Lv '+o:''}</small></div>`});
 return h+'</div>'},
settings(){
 return `<h2>Settings</h2><div class="card"><b>Save</b><br><small>Autosaves every 10 seconds in this browser.</small><div class="row"><button class="btn" data-a="save">Save now</button><button class="btn gh" data-a="export">Copy save</button><button class="btn gh" data-a="import">Load save</button></div></div><div class="card"><b>Danger zone</b><div class="row"><button class="btn gh" data-a="reset">Reset progress</button></div></div>`}
};

function render(){
 $('hud').innerHTML=`<div class="pl"><div class="dia"><span>${GK[S.g]}</span></div><div><b>${GR[S.g]}</b><small class="r${S.g}">${RA[S.g]}</small></div></div><span class="chip"><em>TP</em><b>${f(S.tp)}</b></span><span class="chip"><em>¥</em><b>${f(S.yen)}</b></span><span class="chip"><em>◈</em><b>${S.core}</b></span>`;
 const h=V[tab](),m=$('main');m.className=tab;if(h!==last){last=h;const sc=m.scrollTop;m.innerHTML=h;m.scrollTop=sc}
 const t=$('toast');t.textContent=L[0]||'';t.classList.toggle('on',L.length>0&&tab!='battle'&&Date.now()-TS<3500);
 document.querySelectorAll('#nav>button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('crest').classList.toggle('on',MENU.some(x=>x[0]==tab))}

/* ===== INPUT ===== */
document.addEventListener('click',e=>{
 if(e.target.id=='go'){const ti=$('title');ti.classList.add('out');setTimeout(()=>ti.remove(),700);TS=Date.now();return}
 const op=!!e.target.closest('#crest')&&!$('fan').classList.contains('open');
 $('fan').classList.toggle('open',op);$('crest').classList.toggle('open',op);
 const b=e.target.closest('[data-a],[data-t]');if(!b)return;const{a,t,k,i}=b.dataset;
 if(t){tab=t;$('main').scrollTop=0}
 else if(a=='train')addTp(click());
 else if(a=='focus')focus();
 else if(a=='stat'){const c=cost(S.s[k]);if(S.tp>=c){S.tp-=c;S.s[k]++}}
 else if(a=='up'){const u=UP.find(x=>x[0]==k),c=ucost(u);if(S.yen>=c){S.yen-=c;S.u[k]++}}
 else if(a=='go')start('mission',+i,0);
 else if(a=='quest'){tab='battle';if(!C)start('mission',S.g,0)}
 else if(a=='exam'){if(T()>=NEED[S.g])start('exam',S.g,1)}
 else if(a=='cal')start('cal',4,1,1+S.rec.cal*.5);
 else if(a=='act')act(k);
 else if(a=='back')C=null;
 else if(a=='awaken')awaken();
 else if(a=='eq'){const n=+k,x=S.eq.indexOf(n);if(x>=0)S.eq.splice(x,1);else if(S.eq.length<3)S.eq.push(n)}
 else if(a=='save'){save();lg('Game saved.')}
 else if(a=='export'){const j=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(j).then(()=>lg('Save copied to clipboard.'),()=>prompt('Copy your save:',j));else prompt('Copy your save:',j)}
 else if(a=='import'){const j=prompt('Paste your save');if(j)try{S={...fresh(),...JSON.parse(j)};save();C=null;lg('Save loaded.')}catch(x){lg('That save could not be read.')}}
 else if(a=='reset'&&confirm('Erase all progress?')){localStorage.removeItem(SAVE);S=fresh();C=null;combo=0;L=[];RL=null}
 render()});
addEventListener('beforeunload',save);

/* ===== LOOP (idle gains, achievements, autosave) ===== */
(function raf(){const m=$('mk');if(m)m.style.left=`calc(${pos()*100}% - 2px)`;requestAnimationFrame(raf)})();
let lt=Date.now(),sv=Date.now(),ck=0;
setInterval(()=>{const n=Date.now(),dt=(n-lt)/1000;lt=n;addTp(auto()*dt);
 if(n-ck>1000){ck=n;AC.forEach(a=>{if(!S.ach[a[0]]&&a[3](S)){S.ach[a[0]]=1;S.core++;lg(`Achievement: ${a[1]} (+1 core)`)}})}
 if(n-sv>10000){sv=n;save()}
 render()},200);

/* ===== BOOT ===== */
buildNav();
$('go').textContent=S.rec.tp>0?'Continue':'Begin';
const off=Math.min((Date.now()-S.t)/1000,28800);
if(off>60&&auto()>0){const g=auto()*off*.5;addTp(g);lg(`Away for ${Math.round(off/60)} min: +${f(g)} TP`)}
render();
</script>
</body>
</html>
